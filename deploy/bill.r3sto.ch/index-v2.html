/* Main card */
.card{width:100%;max-width:480px;margin-top:16px;padding:0 16px}
.bill-card{background:var(--surf);border-radius:20px;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,.06)}

/* Bill header */
.bill-head{padding:20px 20px 16px;border-bottom:1px solid var(--brd)}
.bill-title{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.bill-sub{font-size:13px;color:var(--t3);margin-top:3px;font-family:'DM Mono',monospace}

/* Ligne articles */
.items{padding:12px 0}
.item-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 20px}
.item-row .item-name{font-size:14px;color:var(--text);flex:1}
.item-row .item-qty{font-size:12px;color:var(--t3);font-family:'DM Mono',monospace;margin-right:12px}
.item-row .item-price{font-size:14px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text)}
.divider{height:1px;background:var(--brd);margin:8px 20px}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--surf2)}
.total-lbl{font-size:15px;font-weight:700}
.total-amt{font-size:24px;font-weight:800;font-family:'DM Mono',monospace;letter-spacing:-.02em;color:var(--text)}

/* Tip */
.tip-section{padding:16px 20px;border-top:1px solid var(--brd)}
.tip-title{font-size:12px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.tip-btns{display:flex;gap:8px}
.tip-btn{flex:1;padding:10px 4px;border:1.5px solid var(--brd);border-radius:10px;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:.15s;text-align:center}
.tip-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
.tip-custom{margin-top:8px;display:none;align-items:center;gap:8px}
.tip-custom.show{display:flex}
.tip-custom input{flex:1;padding:9px 12px;border:1.5px solid var(--brd);border-radius:10px;font-family:'DM Mono',monospace;font-size:14px;font-weight:700;color:var(--text);background:transparent;outline:none}
.tip-custom input:focus{border-color:var(--bl)}
.tip-result{font-size:12px;color:var(--t3);font-family:'DM Mono',monospace;padding:4px 0 0 20px}

/* Split */
.split-section{padding:0 20px 16px;border-top:1px solid var(--brd)}
.split-title{font-size:12px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;margin-top:16px}
.split-row{display:flex;align-items:center;gap:10px}
.split-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--brd);background:transparent;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:.1s;font-family:'DM Sans',sans-serif}
.split-btn:active{background:var(--surf2)}
.split-n{font-size:20px;font-weight:800;font-family:'DM Mono',monospace;min-width:24px;text-align:center}
.split-lbl{font-size:13px;color:var(--t3)}
.split-each{font-size:15px;font-weight:700;font-family:'DM Mono',monospace;margin-left:auto;color:var(--bl)}

/* Pay button */
.pay-section{padding:16px 20px 20px}
.pay-btn{width:100%;min-height:36px;padding:16px;background:var(--text);color:#fff;border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.pay-btn:hover{opacity:.9}
.pay-btn:active{transform:scale(.98)}
.pay-btn.twint{background:#fff;color:#000;border:2px solid #000}
.pay-amount{font-family:'DM Mono',monospace;font-weight:800}
.payment-logos{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;opacity:.5}
.payment-logos span{font-size:11px;font-weight:600;color:var(--t3)}

/* Stripe element */
#stripe-element-wrap{margin-top:12px;display:none}
#stripe-element-wrap.show{display:block}
#stripe-payment-element{padding:16px;border:1.5px solid var(--brd);border-radius:14px;background:#fff}
.stripe-submit{width:100%;margin-top:12px;padding:14px;background:var(--bl);color:#fff;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.stripe-submit:disabled{opacity:.5;cursor:default}

/* States */
.state{display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;min-height:200px}
.state.show{display:flex}
.state-icon{font-size:52px;margin-bottom:12px;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.state-title{font-size:20px;font-weight:700;margin-bottom:6px}
.state-sub{font-size:14px;color:var(--t3);line-height:1.5}

/* Loading */
.loader{width:32px;height:32px;border:3px solid var(--brd);border-top-color:var(--bl);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sonnette */
.bell-strip{width:100%;max-width:480px;margin:12px 16px 0;padding:12px 16px;background:var(--surf);border-radius:14px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px solid var(--brd);transition:.15s}
.bell-strip:active{background:var(--surf2)}
.bell-ico{font-size:22px}
.bell-txt{flex:1}
.bell-txt-main{font-size:13px;font-weight:700;color:var(--text)}
.bell-txt-sub{font-size:11px;color:var(--t3);margin-top:1px}
.bell-arrow{font-size:16px;color:var(--t3)}

/* Bell confirm */
.bell-confirm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.bell-confirm.show{display:flex}
.bell-sheet{width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 36px;animation:slideUp .25s cubic-bezier(.34,1.2,.64,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.bell-sheet-title{font-size:18px;font-weight:700;margin-bottom:6px}
.bell-sheet-sub{font-size:13px;color:var(--t3);margin-bottom:20px}
.bell-options{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.bell-opt{min-height:36px;padding:14px 16px;border:1.5px solid var(--brd);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;background:transparent;width:100%;font-family:'DM Sans',sans-serif;color:var(--text);transition:.12s}
.bell-opt:active{background:var(--surf2)}
.bell-opt.danger{border-color:rgba(229,57,53,.3);color:var(--rd)}
.bell-cancel{width:100%;padding:14px;border:none;background:var(--surf2);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--t2);cursor:pointer}

/* Thank you */
.thankyou{display:none;position:fixed;inset:0;background:#fff;z-index:200;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;animation:fadeIn .3s}
.thankyou.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ty-logo{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:32px}
.ty-icon{font-size:72px;margin-bottom:20px;animation:pop .5s cubic-bezier(.34,1.56,.64,1) .1s both}
.ty-title{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.ty-sub{font-size:15px;color:var(--t3);line-height:1.6;max-width:280px;margin:0 auto}
.ty-details{margin-top:24px;background:var(--bg);border-radius:14px;padding:14px 18px;width:100%;max-width:320px}
.ty-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}

// ── LANGUAGE MANAGEMENT
var currentLang = localStorage.getItem('r3sto_lang') || 'fr';

function switchLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('r3sto_lang', lang);
  
  document.querySelectorAll('.lang-btn').forEach(function(btn) {
    btn.classList.remove('active');
  });
  document.querySelector('.lang-btn[data-lang="' + lang + '"]').classList.add('active');
  
  applyTranslations();
}

function t(key) {
  return BILL_I18N[currentLang][key] || BILL_I18N['fr'][key];
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
}

// ── CONFIG (injectée dynamiquement par le serveur ou URL params)
var BILL = {
  tableId: null,
  tableName: 'T3',
  restoName: 'R3STO',
  service: 'Soir',
  date: null,
  items: [],
  subtotal: 0,
  stripeKey: null,
  sessionId: null,
  apiBase: 'https://api.r3sto.ch',
};

// ── ÉTAT LOCAL
var tipAmt = 0, tipPct = 'custom', splitN = 1;
var stripeInstance = null, stripeElements = null, clientSecret = null;

// ── INIT
window.addEventListener('DOMContentLoaded', function() {
  document.querySelector('.lang-btn[data-lang="' + currentLang + '"]').classList.add('active');
  applyTranslations();
  
  var params = new URLSearchParams(window.location.search);
  var tableId = params.get('table_id');

  if (!tableId) {
    // No table_id: error state already visible by default in HTML, just hide bell
    document.querySelector('.bell-strip').style.display='none';
    return;
  }

  // table_id exists: hide error, show loading, fetch data
  document.getElementById('state-error').style.display='none';
  document.getElementById('state-loading').style.display='flex';
  BILL.tableId = tableId;

  fetch(BILL.apiBase + '/bill/get?table_id=' + encodeURIComponent(tableId))
    .then(function(r) {
      if (!r.ok) throw new Error('API error: ' + r.status);
      return r.json();
    })
    .then(function(data) {
      if (!data || !data.items || data.items.length === 0) {
        showError('Aucune commande trouvée pour cette table.');
        return;
      }
      loadBill(data);
    })
    .catch(function(err) {
      showError('Impossible de charger la note. Vérifiez le lien ou réessayez.');
    });
});

function loadBill(data) {
  BILL.tableName  = data.tableName || BILL.tableName;
  BILL.restoName  = data.restoName || 'R3STO';
  BILL.service    = data.service   || 'Service';
  BILL.items      = data.items     || [];
  BILL.subtotal   = data.subtotal  || 0;
  BILL.stripeKey  = data.stripeKey || null;

  document.getElementById('resto-name').textContent = BILL.restoName;
  document.getElementById('table-badge').textContent = BILL.tableName;
  document.getElementById('ty-logo').textContent = BILL.restoName;
  
  var serviceText = BILL.service.charAt(0).toUpperCase() + BILL.service.slice(1).toLowerCase();
  document.getElementById('bill-sub').textContent = 'Service du ' + serviceText + ' · ' + BILL.tableName;
  document.getElementById('bell-sheet-sub').textContent = BILL.tableName + ' · Service du ' + serviceText;

  var html = '';
  BILL.items.forEach(function(item) {
    html += '<div class="item-row">'
      + '<span class="item-name">' + item.name + '</span>'
      + '<span class="item-qty">' + (item.qty > 1 ? item.qty + '×' : '') + '</span>'
      + '<span class="item-price">CHF ' + (item.price * item.qty).toFixed(2) + '</span>'
      + '</div>';
  });
  document.getElementById('bill-items').innerHTML = html;

  tipAmt = 0;
  updateTotals();

  document.getElementById('state-loading').classList.remove('show');
  document.getElementById('bill-content').style.display = '';
}

function showError(msg) {
  document.getElementById('state-loading').classList.remove('show');
  var errMsg = msg || t('error_desc');
  document.getElementById('error-msg').textContent = errMsg;
  document.getElementById('state-error').classList.add('show');
}

// ── POURBOIRE
function setTip(pct) {
  tipPct = pct;
  document.querySelectorAll('.tip-btn').forEach(function(b) {
    b.classList.remove('active');
    if ((+b.dataset.pct === pct) || (b.dataset.pct === 'custom' && pct === 'custom')) {
      b.classList.add('active');
    }
  });
  var wrap = document.getElementById('tip-custom-wrap');
  if (pct === 'custom') {
    wrap.classList.add('show');
  } else {
    wrap.classList.remove('show');
    tipAmt = pct > 0 ? Math.round(BILL.subtotal * pct) / 100 : 0;
    updateTotals();
  }
}

function updateCustomTip() {
  tipAmt = parseFloat(document.getElementById('tip-custom-input').value) || 0;
  updateTotals();
}

// ── SPLIT
function setSplit(delta) {
  splitN = Math.max(1, Math.min(20, splitN + delta));
  document.getElementById('split-n').textContent = splitN;
  document.getElementById('split-s').textContent = splitN > 1 ? 's' : '';
  updateTotals();
}

// ── TOTAUX
function updateTotals() {
  var grand = BILL.subtotal + tipAmt;
  var perPerson = splitN > 1 ? grand / splitN : 0;

  document.getElementById('total-display').textContent = 'CHF ' + BILL.subtotal.toFixed(2);
  document.getElementById('pay-amount-btn').textContent =
    'CHF ' + (splitN > 1 ? perPerson.toFixed(2) : grand.toFixed(2));

  if (tipAmt > 0) {
    var tipText = t('tip_amount') + ' CHF ' + tipAmt.toFixed(2) + ' · ' + t('total') + ' CHF ' + grand.toFixed(2);
    document.getElementById('tip-result').textContent = tipText;
  } else {
    document.getElementById('tip-result').textContent = '';
  }

  if (splitN > 1) {
    document.getElementById('split-each').textContent = 'CHF ' + perPerson.toFixed(2) + ' / pers.';
  } else {
    document.getElementById('split-each').textContent = '';
  }
}

function getPayAmount() {
  var grand = BILL.subtotal + tipAmt;
  return splitN > 1 ? grand / splitN : grand;
}

// ── PAIEMENT STRIPE
function startPayment() {
  var amount = getPayAmount();
  if (amount <= 0) return;

  document.getElementById('pay-btn').disabled = true;
  document.getElementById('pay-btn').innerHTML = '<div class="loader" style="width:20px;height:20px;border-width:2px;border-color:#fff3;border-top-color:#fff"></div>';

  fetch(BILL.apiBase + '/bill/create-intent', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      tableId: BILL.tableId,
      amount: Math.round(amount * 100),
      currency: 'chf',
      tip: Math.round(tipAmt * 100),
      split: splitN,
      sessionId: BILL.sessionId,
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    clientSecret = data.clientSecret;
    if (!clientSecret) throw new Error('No client secret');
    showStripeElement(clientSecret);
  })
  .catch(function(err) {
    simulatePayment(amount);
  });
}

function showStripeElement(secret) {
  if (!BILL.stripeKey || BILL.stripeKey === 'pk_test_demo') {
    simulatePayment(getPayAmount());
    return;
  }

  stripeInstance = Stripe(BILL.stripeKey);
  stripeElements = stripeInstance.elements({
    clientSecret: secret,
    appearance: {
      theme: 'flat',
      variables: {
        colorPrimary: '#4480d8',
        colorBackground: '#ffffff',
        colorText: '#1a1a1a',
        fontFamily: 'DM Sans, sans-serif',
        borderRadius: '10px',
      }
    }
  });

  var paymentElement = stripeElements.create('payment', {
    layout: 'tabs',
    wallets: {applePay: 'auto', googlePay: 'auto'}
  });
  paymentElement.mount('#stripe-payment-element');

  document.getElementById('pay-btn').style.display = 'none';
  document.getElementById('stripe-element-wrap').classList.add('show');
}

function confirmStripePayment() {
  if (!stripeInstance || !stripeElements) return;
  var btn = document.getElementById('stripe-submit');
  btn.disabled = true;
  btn.textContent = t('processing');

  stripeInstance.confirmPayment({
    elements: stripeElements,
    confirmParams: {
      return_url: window.location.href + '&paid=1',
    },
    redirect: 'if_required',
  }).then(function(result) {
    if (result.error) {
      btn.disabled = false;
      btn.textContent = t('confirm_payment');
      alert(result.error.message);
    } else {
      onPaymentSuccess();
    }
  });
}

function simulatePayment(amount) {
  setTimeout(function() {
    onPaymentSuccess();
  }, 800);
}

function onPaymentSuccess() {
  fetch(BILL.apiBase + '/bill/paid', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      tableId: BILL.tableId,
      amount: getPayAmount(),
      tip: tipAmt,
    })
  }).catch(function() {});

  var grand = BILL.subtotal + tipAmt;
  var per = splitN > 1 ? grand / splitN : grand;
  var html = '<div class="ty-row"><span>' + t('subtotal') + '</span><span>CHF ' + BILL.subtotal.toFixed(2) + '</span></div>';
  if (tipAmt > 0) html += '<div class="ty-row"><span>' + t('tip_amount') + '</span><span>CHF ' + tipAmt.toFixed(2) + '</span></div>';
  if (splitN > 1) html += '<div class="ty-row"><span>' + t('your_share') + ' (1/' + splitN + ')</span><span>CHF ' + per.toFixed(2) + '</span></div>';
  html += '<div class="ty-row total"><span>' + t('paid') + '</span><span>CHF ' + per.toFixed(2) + '</span></div>';
  document.getElementById('ty-details').innerHTML = html;

  document.getElementById('thankyou').classList.add('show');
  launchConfetti();
}

// ── SONNETTE
function openBell() {
  document.getElementById('bell-confirm').classList.add('show');
}
function closeBell() {
  document.getElementById('bell-confirm').classList.remove('show');
}
function sendBell(type) {
  closeBell();
  var msgs = {
    service: '🙋 ' + BILL.tableName + ' — appel serveur',
    commander: '📋 ' + BILL.tableName + ' — commande',
    eau: '💧 ' + BILL.tableName + ' — carafe d\'eau',
    addition: '💳 ' + BILL.tableName + ' — demande addition',
  };
  var msg = msgs[type] || '🔔 ' + BILL.tableName;

  fetch(BILL.apiBase + '/bell/ring', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ tableId: BILL.tableId, tableName: BILL.tableName, type: type, msg: msg })
  }).catch(function() {});

  var strip = document.querySelector('.bell-strip');
  strip.style.background = '#f0fff4';
  strip.style.borderColor = 'var(--gn)';
  strip.innerHTML = '<div class="bell-ico">✅</div><div class="bell-txt"><div class="bell-txt-main" style="color:var(--gn)">' + t('message_sent') + '</div><div class="bell-txt-sub">' + t('service_notified') + '</div></div>';
  setTimeout(function() {
    strip.style.background = '';
    strip.style.borderColor = '';
    strip.innerHTML = '<div class="bell-ico">🔔</div><div class="bell-txt"><div class="bell-txt-main">' + t('bell_title') + '</div><div class="bell-txt-sub">' + t('bell_desc') + '</div></div><div class="bell-arrow">›</div>';
    strip.onclick = openBell;
  }, 3000);
}

// ── CONFETTI
function launchConfetti() {
  var canvas = document.getElementById('confetti-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var ctx = canvas.getContext('2d');
  var pieces = [];
  var colors = ['#4480d8','#00a550','#f5a623','#e53935','#9c27b0','#1a1a1a'];
  for (var i = 0; i < 80; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20,
      r: Math.random() * 6 + 3,
      d: Math.random() * 3 + 1,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 3,
    });
  }
  var frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function(p) {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      p.y += p.d;
      p.x += p.vx;
    });
    pieces = pieces.filter(function(p) { return p.y < canvas.height; });
    frame++;
    if (frame < 200 && pieces.length > 0) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

setTip('custom');
</script>
