<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R3STO — Démo</title>
<link rel="icon" type="image/jpeg" href="/logo-r3sto.jpg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --surf2:#111e33;
  --ac:#5b9cf6;
  --gn:#3cc870;
  --text:#e8edf5;
  --ff:'DM Sans',sans-serif;
  --fm:'DM Mono',monospace;
}

/* ── LOGIN — identique admin.r3sto.ch ── */
.login-container {
  position:fixed;inset:0;background:#060e1c;
  display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:2000;
  -webkit-font-smoothing:antialiased;
}
.login-container::before {
  content:'';position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%,rgba(28,79,144,.18) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 80%,rgba(43,91,160,.12) 0%,transparent 60%);
}
.login-grid {
  position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(44,91,160,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(44,91,160,.04) 1px,transparent 1px);
  background-size:40px 40px;
}

.login-card {
  position:relative;background:var(--surf2);
  border:1px solid rgba(44,91,160,.25);border-radius:18px;
  padding:22px 28px 26px;width:100%;max-width:440px;
  box-shadow:0 24px 64px rgba(0,0,0,.48),0 0 0 1px rgba(255,255,255,.03);
  animation:loginUp .3s ease;display:flex;flex-direction:column;
}
@keyframes loginUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.login-logo{display:flex;justify-content:center;padding:0 0 14px}
.login-logo img{width:80px;height:80px;object-fit:cover;border-radius:0}

/* Lang pills */
.login-lang-sw{display:flex;justify-content:center;gap:5px;margin-bottom:14px}
.login-lbtn{
  padding:3px 8px;border:1px solid rgba(44,91,160,.25);border-radius:5px;
  background:transparent;color:#6b82a8;font-size:10px;font-weight:700;
  font-family:var(--fm);cursor:pointer;transition:.15s;letter-spacing:.04em;
}
.login-lbtn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.login-lbtn:hover:not(.on){border-color:rgba(44,91,160,.45);color:var(--text)}

/* Badge */
.login-badge{display:flex;justify-content:center;margin-bottom:12px}
.login-badge-inner{
  display:inline-flex;align-items:center;gap:5px;padding:3px 12px;
  border:1px solid rgba(44,91,160,.45);border-radius:30px;
  font-size:10px;font-family:var(--fm);color:#6b82a8;letter-spacing:.04em;
}
.login-dot{width:5px;height:5px;border-radius:50%;background:var(--gn);animation:loginPulse 2s infinite}
@keyframes loginPulse{0%,100%{opacity:1}50%{opacity:.4}}

.login-title{font-size:20px;font-weight:800;color:var(--text);text-align:center;margin-bottom:2px}
.login-subtitle{font-size:11.5px;color:#6b82a8;text-align:center;margin-bottom:18px;line-height:1.4}

.login-form{display:flex;flex-direction:column;gap:10px}

.login-field{position:relative;margin-bottom:0}
.login-field label{
  display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:#6b82a8;margin-bottom:5px;
}
.login-field input{
  width:100%;padding:10px 13px;background:#0c1829;
  border:1.5px solid rgba(44,91,160,.25);border-radius:9px;
  color:var(--text);font-family:var(--ff);font-size:13.5px;
  outline:none;transition:border-color .2s,box-shadow .2s;
}
.login-field input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(68,128,216,.1)}
.login-field input:valid{border-color:rgba(44,91,160,.25)}
.login-field input:valid:focus{border-color:var(--ac)}
.login-field input:-webkit-autofill,
.login-field input:-webkit-autofill:hover,
.login-field input:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 50px #0c1829 inset!important;
  -webkit-text-fill-color:var(--text)!important;
  border-color:rgba(44,91,160,.25)!important;
  transition:background-color 5000s ease-in-out 0s;
}
.login-field input::placeholder{color:rgba(107,130,168,.5)}

.login-btn{
  width:100%;padding:13px;border:none;border-radius:10px;
  background:var(--ac);color:#fff;font-family:var(--ff);
  font-size:13.5px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s,transform .1s;margin-top:4px;
}
.login-btn:hover{background:#3570c4;transform:translateY(-1px)}
.login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

.login-spin{
  width:13px;height:13px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:loginSpin .6s linear infinite;display:none;flex-shrink:0;
}
@keyframes loginSpin{to{transform:rotate(360deg)}}

/* Messages */
.login-msg{padding:9px 13px;border-radius:8px;font-size:12.5px;margin-bottom:10px;display:none}
.login-msg.err{background:rgba(224,85,85,.1);border:1px solid rgba(224,85,85,.3);color:#e57a7a}
.login-msg.ok{background:rgba(60,200,112,.1);border:1px solid rgba(60,200,112,.3);color:var(--gn)}
.login-msg.show{display:block;animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

@media(max-width:480px){.login-card{padding:20px 20px 22px;min-width:auto}}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-grid"></div>
  <div class="login-card">
    <div class="login-logo">
      <img src="/logo-r3sto.jpg" alt="R3STO">
    </div>
    <div class="login-lang-sw" id="loginLangSw">
      <button class="login-lbtn" onclick="setDemoLang('fr')">FR</button>
      <button class="login-lbtn" onclick="setDemoLang('de')">DE</button>
      <button class="login-lbtn" onclick="setDemoLang('it')">IT</button>
      <button class="login-lbtn" onclick="setDemoLang('en')">EN</button>
    </div>
    <div class="login-badge"><div class="login-badge-inner"><span class="login-dot"></span><span id="badgeTxt">Espace démo</span></div></div>
    <h2 class="login-title" id="demoTitle">Bon retour &#x1F44B;</h2>
    <p class="login-subtitle" id="demoSub">Accédez à la démo interactive R3STO</p>

    <div class="login-msg err" id="errorMsg"></div>
    <div class="login-msg ok" id="successMsg"></div>

    <form class="login-form" id="loginForm" onsubmit="return doLogin(event)">
      <div class="login-field">
        <label id="lbl-email">EMAIL</label>
        <input type="email" id="inputEmail" placeholder="vous@restaurant.ch" autocomplete="email" required autofocus>
      </div>
      <div class="login-field">
        <label id="lbl-pw">MOT DE PASSE</label>
        <div style="position:relative;display:flex;align-items:center">
          <input type="password" id="inputPw" placeholder="••••••••" autocomplete="current-password" required style="padding-right:42px;flex:1;min-width:0">
          <button type="button" id="togglePwBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px 8px;line-height:1;display:flex;align-items:center;color:#6b82a8" title="Afficher/masquer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <label style="display:flex;align-items:center;gap:8px;font-size:11px;cursor:pointer;user-select:none;color:#6b82a8">
          <input type="checkbox" id="rememberMe" checked style="width:14px;height:14px;cursor:pointer;accent-color:var(--ac)">
          <span id="lbl-remember">Garder la connexion</span>
        </label>
        <a href="#" id="forgotPwLink" style="font-size:11px;color:#6b82a8;text-decoration:none" onclick="event.preventDefault();doForgotPw()">Mot de passe oublié ?</a>
      </div>
      <button type="submit" class="login-btn" id="submitBtn"><span class="login-spin" id="loginSpinner"></span><span id="btnTxt">Se connecter</span></button>
    </form>
  </div>
</div>

<script>
var API = 'https://api.r3sto.ch';
var DEMO_LANG = 'fr';

/* ── SVGs ── */
var eyeOpen = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
var eyeOff  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

/* ── Eye toggle ── */
document.getElementById('togglePwBtn').addEventListener('click', function(){
  var pw = document.getElementById('inputPw');
  var btn = document.getElementById('togglePwBtn');
  if(pw.type==='password'){ pw.type='text'; btn.innerHTML=eyeOff; }
  else{ pw.type='password'; btn.innerHTML=eyeOpen; }
});

/* ── i18n ── */
var DEMO_I18N = {
  fr: {
    title:'Bon retour \u{1F44B}', sub:'Accédez à la démo interactive R3STO',
    badge:'Espace démo',
    email:'EMAIL', pw:'MOT DE PASSE',
    ph_email:'vous@restaurant.ch', ph_pw:'••••••••',
    remember:'Garder la connexion', forgot:'Mot de passe oublié ?',
    forgot_msg:'Contactez votre administrateur pour réinitialiser votre mot de passe.', forgot_prompt:'Entrez votre email pour recevoir un lien de réinitialisation :', forgot_sent:'Si ce compte existe, un email de réinitialisation a été envoyé.',
    btn:'Se connecter',
    err_empty:'Veuillez remplir tous les champs.',
    err_auth:'Email ou mot de passe incorrect.',
    err_server:'Serveur indisponible. Réessayez.',
    ok:'Connexion réussie — redirection…'
  },
  de: {
    title:'Willkommen zurück \u{1F44B}', sub:'Zugang zur interaktiven R3STO-Demo',
    badge:'Demo-Bereich',
    email:'E-MAIL', pw:'PASSWORT',
    ph_email:'sie@restaurant.ch', ph_pw:'••••••••',
    remember:'Angemeldet bleiben', forgot:'Passwort vergessen?',
    forgot_msg:'Kontaktieren Sie Ihren Administrator, um Ihr Passwort zurückzusetzen.', forgot_prompt:'Geben Sie Ihre E-Mail ein:', forgot_sent:'Falls dieses Konto existiert, wurde eine E-Mail gesendet.',
    btn:'Anmelden',
    err_empty:'Bitte füllen Sie alle Felder aus.',
    err_auth:'E-Mail oder Passwort falsch.',
    err_server:'Server nicht verfügbar. Versuchen Sie es erneut.',
    ok:'Anmeldung erfolgreich — Weiterleitung…'
  },
  en: {
    title:'Welcome back \u{1F44B}', sub:'Access the interactive R3STO demo',
    badge:'Demo area',
    email:'EMAIL', pw:'PASSWORD',
    ph_email:'you@restaurant.com', ph_pw:'••••••••',
    remember:'Stay signed in', forgot:'Forgot password?',
    forgot_msg:'Contact your administrator to reset your password.', forgot_prompt:'Enter your email to receive a reset link:', forgot_sent:'If this account exists, a reset email has been sent.',
    btn:'Sign in',
    err_empty:'Please fill in all fields.',
    err_auth:'Incorrect email or password.',
    err_server:'Server unavailable. Please try again.',
    ok:'Login successful — redirecting…'
  },
  it: {
    title:'Bentornato \u{1F44B}', sub:'Accedi alla demo interattiva R3STO',
    badge:'Area demo',
    email:'EMAIL', pw:'PASSWORD',
    ph_email:'tu@ristorante.ch', ph_pw:'••••••••',
    remember:'Resta connesso', forgot:'Password dimenticata?',
    forgot_msg:'Contattare il tuo amministratore per reimpostare la password.', forgot_prompt:'Inserisci la tua email:', forgot_sent:'Se questo account esiste, è stata inviata un\'email.',
    btn:'Accedi',
    err_empty:'Compilare tutti i campi.',
    err_auth:'Email o password errati.',
    err_server:'Server non disponibile. Riprova.',
    ok:'Accesso riuscito — reindirizzamento…'
  }
};

function setDemoLang(lang) {
  DEMO_LANG = lang;
  var L = DEMO_I18N[lang] || DEMO_I18N.fr;
  document.getElementById('demoTitle').innerHTML = L.title;
  document.getElementById('demoSub').textContent = L.sub;
  document.getElementById('badgeTxt').textContent = L.badge;
  document.getElementById('lbl-email').textContent = L.email;
  document.getElementById('lbl-pw').textContent = L.pw;
  document.getElementById('inputEmail').placeholder = L.ph_email;
  document.getElementById('inputPw').placeholder = L.ph_pw;
  document.getElementById('lbl-remember').textContent = L.remember;
  document.getElementById('forgotPwLink').textContent = L.forgot;
  document.getElementById('btnTxt').textContent = L.btn;
  document.querySelectorAll('.login-lbtn').forEach(function(b){
    b.classList.toggle('on', b.textContent.trim() === lang.toUpperCase());
  });
}

/* ── Error / success helpers ── */
function showErr(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 4000);
}
function showOk(msg) {
  var el = document.getElementById('successMsg');
  el.textContent = msg; el.classList.add('show');
}

/* ── Auth: store & check token ── */
function storeToken(token, remember) {
  if (remember) localStorage.setItem('r3sto_demo_token', token);
  sessionStorage.setItem('r3sto_demo_token', token);
}
function getToken() {
  return sessionStorage.getItem('r3sto_demo_token') || localStorage.getItem('r3sto_demo_token') || null;
}
function isTokenValid(token) {
  if (!token) return false;
  try {
    var payload = JSON.parse(atob(token.split('.')[1]));
    if (payload.exp && payload.exp * 1000 < Date.now()) return false;
    return true;
  } catch(e) { return false; }
}
function enterDemo() {
  sessionStorage.setItem('r3sto_demo_auth', 'true');
  var role = new URLSearchParams(window.location.search).get('role') || 'proprietaire';
  window.location.href = '/?demo&role=' + role;
}

/* ── Forgot password ── */
function doForgotPw() {
  var L = DEMO_I18N[DEMO_LANG] || DEMO_I18N.fr;
  var email = document.getElementById('inputEmail').value || '';
  email = prompt(L.forgot_prompt || 'Entrez votre email pour recevoir un lien de réinitialisation :', email);
  if (!email) return;
  fetch(API + '/auth/forgot-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email }) })
    .then(function(r) { return r.json(); })
    .then(function() { showSuccess(L.forgot_sent || 'Si ce compte existe, un email de réinitialisation a été envoyé.'); })
    .catch(function() { showErr('Erreur serveur'); });
}
function showSuccess(msg) {
  var el = document.getElementById('successMsg');
  el.textContent = msg;
  el.classList.add('show');
}

/* ── Login via API ── */
function doLogin(e) {
  e.preventDefault();
  var L = DEMO_I18N[DEMO_LANG] || DEMO_I18N.fr;
  var email = document.getElementById('inputEmail').value.trim();
  var pw    = document.getElementById('inputPw').value;
  var remember = document.getElementById('rememberMe').checked;
  var btn   = document.getElementById('submitBtn');
  var spin  = document.getElementById('loginSpinner');
  var btnTxt = document.getElementById('btnTxt');

  if (!email || !pw) { showErr(L.err_empty); return false; }

  btn.disabled = true;
  spin.style.display = 'inline-block';
  btnTxt.textContent = '…';

  fetch(API + '/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: pw })
  })
  .then(function(res) {
    return res.json().then(function(data) { return { ok: res.ok, data: data }; });
  })
  .then(function(result) {
    if (!result.ok) {
      showErr(result.data.error || result.data.message || L.err_auth);
      btn.disabled = false; spin.style.display = 'none'; btnTxt.textContent = L.btn;
      return;
    }
    var token = result.data.access_token || result.data.token;
    if (!token) {
      showErr(L.err_auth);
      btn.disabled = false; spin.style.display = 'none'; btnTxt.textContent = L.btn;
      return;
    }
    storeToken(token, remember);
    // Also store in SPA format for React app
    var spaStore = remember ? localStorage : sessionStorage;
    spaStore.setItem('r3sto-token', token);
    if (result.data.user) { spaStore.setItem('r3sto-user', JSON.stringify(result.data.user)); } else { try { var p = JSON.parse(atob(token.split('.')[1])); spaStore.setItem('r3sto-user', JSON.stringify({id:p.sub||0, email:email, name:p.name||email.split('@')[0], role:p.role||'user'})); } catch(e){} } // was: spaStore.setItem('r3sto-user', JSON.stringify(result.data.user));
    showOk(L.ok);
    setTimeout(enterDemo, 600);
  })
  .catch(function() {
    showErr(L.err_server);
    btn.disabled = false; spin.style.display = 'none'; btnTxt.textContent = L.btn;
  });

  return false;
}

/* ── On load: detect lang, check token ── */
(function() {
  var params = new URLSearchParams(window.location.search);

  // Lang priority: ?lang= URL > navigator.language > 'fr'
  var urlLang = params.get('lang');
  if (urlLang && ['fr','de','en','it'].indexOf(urlLang) !== -1) {
    setDemoLang(urlLang);
  } else {
    var bl = (navigator.language || navigator.userLanguage || 'fr').substring(0,2).toLowerCase();
    if (['fr','de','en','it'].indexOf(bl) !== -1) setDemoLang(bl);
    else setDemoLang('fr');
  }

  // ?token= from admin panel (direct access)
  var urlToken = params.get('token');
  if (urlToken && isTokenValid(urlToken)) {
    storeToken(urlToken, false);
    enterDemo();
    return;
  }

  // Already have a valid token? redirect
  var existing = getToken();
  if (isTokenValid(existing)) {
    sessionStorage.setItem('r3sto_demo_token', existing);
    enterDemo();
    return;
  }

  // Clear stale tokens
  localStorage.removeItem('r3sto_demo_token');
  sessionStorage.removeItem('r3sto_demo_token');
})();
</script>
</body>
</html>
