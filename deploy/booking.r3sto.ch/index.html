:root {
  --blue: #1c4f90;
  --blue-mid: #2B5BA0;
  --bg: #f4f6fb;
  --surface: #ffffff;
  --border: #dde4f0;
  --text: #1a2640;
  --muted: #7a8baa;
  --success: #1a9e6e;
  --danger: #d9534f;
  --r: 12px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 20px 48px;
}

/* ── Logo R3STO ── */
.r3-logo-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:28px; }
.r3-logo-img { width:64px; height:64px; object-fit:cover; border-radius:0; display:block; }
.r3-logo-name { font-family:'AlethiaNext',serif; font-size:18px; font-weight:600; color:var(--text); letter-spacing:.04em; }

/* ── Widget ── */
.widget { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:36px 36px 28px; width:100%; max-width:480px; box-shadow:0 10px 48px rgba(28,79,144,.09); }

.restaurant-name { font-family:'AlethiaNext',serif; font-size:24px; font-weight:600; margin-bottom:4px; }
.restaurant-sub { color:var(--muted); font-size:13px; margin-bottom:24px; }

.steps { display:flex; gap:6px; margin-bottom:24px; }
.step-bar { height:3px; border-radius:2px; flex:1; background:var(--border); transition:background .3s; }
.step-bar.active { background:var(--blue); }
.step-bar.done   { background:var(--success); }

.step-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:20px; }

.field { margin-bottom:14px; }
label { display:block; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-bottom:6px; }
input, select { width:100%; background:var(--bg); border:1.5px solid var(--border); border-radius:var(--r); padding:12px 14px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:15px; outline:none; transition:border-color .2s,box-shadow .2s; }
input[type="text"], input[type="email"], input[type="tel"] { -webkit-appearance:none; }
input[type="date"] { -webkit-appearance:auto; appearance:auto; min-height:46px; }
input[type="date"]::-webkit-calendar-picker-indicator { opacity:1; cursor:pointer; }
input:focus, select:focus { border-color:var(--blue-mid); box-shadow:0 0 0 3px rgba(43,91,160,.1); background:#fff; }

/* ── Tel: styles gérés par r3sto-phone.js (R3Phone) ── */
.phone-hint { font-size:11px; color:var(--muted); margin-top:4px; font-family:'DM Mono',monospace; padding-left:2px; min-height:16px; }

.row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.guests-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:4px; }
.guest-btn { aspect-ratio:1; min-height:48px; border:1.5px solid var(--border); border-radius:var(--r); background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-size:16px; font-weight:600; cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; }
.guest-btn:hover { border-color:var(--blue-mid); color:var(--blue); }
.guest-btn:active { transform:scale(.95); }
.guest-btn.selected { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 2px 8px rgba(28,79,144,.25); }

.time-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:4px; }
.time-grid > div[style*="width:100%"] { grid-column: 1 / -1; }
.svc-label { grid-column: 1 / -1; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0; padding:14px 0 6px; border-top:1px solid var(--border); }
.svc-label:first-child { border-top:none; padding-top:0; }
.time-btn { border:1.5px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; font-size:13px; padding:10px 4px; cursor:pointer; transition:all .15s; text-align:center; }
.time-btn:hover { border-color:var(--blue-mid); color:var(--blue); }
.time-btn.selected { background:var(--blue); border-color:var(--blue); color:#fff; }
.time-btn.unavailable { opacity:.3; cursor:not-allowed; text-decoration:line-through; }

.btn { width:100%; background:var(--blue); border:none; border-radius:var(--r); padding:14px; color:#fff; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:600; cursor:pointer; margin-top:12px; transition:background .2s,box-shadow .2s; box-shadow:0 4px 16px rgba(28,79,144,.28); }
.btn:hover { background:var(--blue-mid); }
.btn-back { width:100%; background:transparent; border:1.5px solid var(--border); border-radius:var(--r); padding:12px; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:14px; cursor:pointer; margin-top:8px; transition:border-color .2s,color .2s; }
.btn-back:hover { border-color:var(--blue-mid); color:var(--blue); }

.screen { display:none; }
.screen.active { display:block; }

.summary-box { margin-top:16px; padding:14px 16px; background:var(--bg); border-radius:var(--r); border:1px solid var(--border); }
.summary-title { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:8px; }
.s-row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:14px; }
.s-row:last-child { border-bottom:none; }
.s-lbl { color:var(--muted); }
.s-val { font-weight:600; }

.success-icon { width:64px; height:64px; background:rgba(26,158,110,.12); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 18px; font-size:28px; color:var(--success); }
.success-title { font-family:'AlethiaNext',serif; font-size:22px; text-align:center; margin-bottom:8px; }
.success-sub { color:var(--muted); font-size:14px; text-align:center; margin-bottom:24px; }

.powered { margin-top:18px; text-align:center; font-size:11px; color:var(--muted); }
.cgu-check { display:flex; align-items:flex-start; gap:8px; margin-top:14px; font-size:12px; color:var(--muted); cursor:pointer; line-height:1.5; }
.cgu-check input[type="checkbox"] { margin-top:3px; accent-color:var(--blue); flex-shrink:0; width:18px; height:18px; min-width:18px; }
.cgu-check a { color:var(--blue); text-decoration:underline; }
.cgu-check a:hover { opacity:.7; }
.powered a { color:var(--blue); text-decoration:none; font-weight:600; }

@media(max-width:480px) { .widget { padding:24px 20px 20px; border-radius:18px; } }

/* ── Language pills ── */
#lang-sw{display:flex;justify-content:center;gap:5px;margin-bottom:14px;}
.lbtn{
  padding:3px 8px;border:1px solid var(--border);border-radius:5px;
  background:transparent;color:var(--muted);font-size:10px;font-weight:700;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:.15s;letter-spacing:.04em;
}
.lbtn.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.lbtn:hover:not(.on){border-color:var(--blue-mid);color:var(--text);}
</style>
</head>

    <button class="btn" id="btn-step2" onclick="goStep3()">Continuer →</button>
    <button class="btn-back" id="btn-back1" onclick="goStep(1)">← Retour</button>
  </div>

  <!-- SCREEN 3 : Coordonnées -->
  <div class="screen" id="s3">
    <div class="steps"><div class="step-bar done"></div><div class="step-bar done"></div><div class="step-bar active"></div></div>
    <div class="step-label" id="sl3">Vos coordonnées</div>

    </div>

    <div class="field">

      <input type="hidden" id="bk-dial-val" value="+41">

    <div class="field"><label id="lbl-notes">Remarques (optionnel)</label><input type="text" id="fnotes" placeholder="Allergie, anniversaire…"></div>
    <div class="summary-box">

      <div class="s-row"><span class="s-lbl" id="sum-lbl-time">Heure</span><span class="s-val" id="sumTime">—</span></div>
      <div class="s-row"><span class="s-lbl" id="sum-lbl-guests">Personnes</span><span class="s-val" id="sumGuests">—</span></div>
    </div>
    <label class="cgu-check" id="cgu-wrap"><input type="checkbox" id="cgu-cb"><span id="cgu-label"></span></label>
    <button class="btn" id="btn-submit" onclick="submitBooking()">Confirmer la réservation</button>
    <button class="btn-back" id="btn-back2" onclick="goStep(2)">← Retour</button>
  </div>

  <!-- SCREEN 4 : Confirmation -->
  <div class="screen" id="s4">
    <div class="success-icon">✓</div>

  </div>

  <div class="powered" id="bk-powered">Propulsé par <a href="https://r3sto.ch" target="_blank">R3STO</a></div>

function renderDemoSlots(grid) {
  grid.innerHTML = '';
  // Dimanche (0) = fermé
  var d = new Date(dateInput.value+'T00:00:00');
  if(d.getDay() === 0) {
    grid.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-style:italic">'+bt('closed')+'</div>';
    return;
  }
  // Vendredi/Samedi = 2 services soir
  var isFriSat = (d.getDay() === 5 || d.getDay() === 6);
  var svcs = [{name:'Midi',slots:['11:30','11:45','12:00','12:15','12:30','12:45','13:00','13:15','13:30']}];
  if(isFriSat) {
    svcs.push({name:'Soir 1er',slots:['18:30','18:45','19:00','19:15','19:30','19:45','20:00']});
    svcs.push({name:'Soir 2e', slots:['21:00','21:15','21:30','21:45','22:00','22:15','22:30']});
  } else {
    svcs.push({name:'Soir',slots:['18:30','18:45','19:00','19:15','19:30','19:45','20:00','20:15','20:30','20:45','21:00']});
  }
  svcs.forEach(function(svc){
    var label = document.createElement('div');
    label.className = 'svc-label';
    label.textContent = svc.name;
    grid.appendChild(label);
    svc.slots.forEach(function(t){
      var btn = document.createElement('button');
      btn.className = 'time-btn';
      btn.textContent = t;
      btn.onclick = function(){ document.querySelectorAll('.time-btn').forEach(function(b){b.classList.remove('selected')}); btn.classList.add('selected'); selectedTime = t; };
      grid.appendChild(btn);
    });
  });
}

function loadRestoConfig() {
  /* Mode d\u00e9mo explicite : fallback jeu fictif */
  if(isDemoParam) { loadDemoFallback(); return; }
  /* Pas de slug \u2192 \u00e9cran vide prod (au lieu du fallback d\u00e9mo) */
  if(!restoSlug) { loadEmptyState(); return; }
  fetch(API + '/public/booking/' + encodeURIComponent(restoSlug))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data.ok) { loadDemoFallback(); return; }
      restoConfig = data;
      restoDbId = data.restaurant.id;

      // Restaurant name
      var nameEl = document.getElementById('restoName');
      if(nameEl && data.restaurant.name) nameEl.textContent = data.restaurant.name;

      // Logo
      var logoWrap = document.getElementById('restoLogo');
      var logoImg  = document.getElementById('restoLogoImg');
      if(data.restaurant.logo && logoImg && logoWrap) {
        logoImg.src = data.restaurant.logo;
        logoImg.alt = data.restaurant.name || '';
        logoWrap.style.display = 'block';
      }

      // Widget color from options (if not overridden by embed param)
      if(!embedColor && data.options && data.options.widgetCouleur) {
        document.documentElement.style.setProperty('--blue', data.options.widgetCouleur);
        document.documentElement.style.setProperty('--blue-mid', data.options.widgetCouleur);
      }
    })
    .catch(function(err){ console.warn('R3STO: could not load restaurant config', err); loadDemoFallback(); });
}
loadRestoConfig();

/* ══════════════════════════════════════════════════════════════
   2) Fetch real availability from API
   ══════════════════════════════════════════════════════════════ */
function fetchAvailability(date, guests) {
  var grid = document.getElementById('timeGrid');
  grid.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted)">' + bt('loading') + '</div>';
  selectedTime = null;

  // Empty state: pas de resto → pas de slots
  if(restoDbId === -1) {
    grid.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-style:italic">\u2014</div>';
    return;
  }
  // Demo mode: generate fake slots instead of hitting API
  if(restoDbId === 0) {
    renderDemoSlots(grid);
    return;
  }

  var id = restoDbId || restoSlug;
  if(!id) {
    grid.innerHTML = '<div style="text-align:center;padding:20px;color:var(--danger)">' + bt('error_load') + '</div>';
    return;
  }

  fetch(API + '/public/availability/' + encodeURIComponent(id) + '?date=' + date + '&guests=' + guests)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data.ok) {
        grid.innerHTML = '<div style="text-align:center;padding:20px;color:var(--danger)">' + bt('error_load') + '</div>';
        return;
      }

      // Restaurant closed?
      if(data.closed) {
        grid.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-style:italic">' + bt('closed') + '</div>';
        return;
      }

      var slots = data.slots || [];
      if(slots.length === 0) {
        grid.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-style:italic">' + bt('no_slots') + '</div>';
        return;
      }

      // Group slots by service
      grid.innerHTML = '';
      var currentService = '';
      slots.forEach(function(s) {
        // Service separator
        if(s.service !== currentService) {
          currentService = s.service;
          var label = document.createElement('div');
          label.className = 'svc-label';
          label.textContent = s.service;
          grid.appendChild(label);
        }

        var btn = document.createElement('button');
        btn.className = 'time-btn' + (s.available ? '' : ' unavailable');
        btn.textContent = s.time;
        if(s.available) {
          btn.onclick = function() {
            document.querySelectorAll('.time-btn').forEach(function(b){ b.classList.remove('selected'); });
            btn.classList.add('selected');
            selectedTime = s.time;
          };
        }
        grid.appendChild(btn);
      });
    })
    .catch(function(err){
      console.error('R3STO availability error', err);
      grid.innerHTML = '<div style="text-align:center;padding:20px;color:var(--danger)">' + bt('error_load') + '</div>';
    });
}

/* ══════════════════════════════════════════════════════════════
   4) Step navigation
   ══════════════════════════════════════════════════════════════ */
function goStep2() {
  if(!dateInput.value) { alert(bt('alert_date')); return; }
  if(!selectedGuests) { alert(bt('alert_guests')); return; }

  // Check group threshold (capacity from config)
  if(restoConfig && restoConfig.restaurant && restoConfig.restaurant.capacity) {
    var maxOnline = Math.min(restoConfig.restaurant.capacity, 20);
    if(selectedGuests > maxOnline) {
      var phone = restoConfig.restaurant.phone || '';
      alert(bt('group_msg').replace('{n}', maxOnline) + (phone ? '\n\nTel: ' + phone : ''));
      return;
    }
  }

  // Fetch real availability from API
  fetchAvailability(dateInput.value, selectedGuests);
  goStep(2);
}

function goStep3() {
  if(!selectedTime) { alert(bt('alert_time')); return; }
  var d = new Date(dateInput.value + 'T00:00:00');
  var opts = {weekday:'long',year:'numeric',month:'long',day:'numeric'};
  document.getElementById('sumDate').textContent = d.toLocaleDateString(bt('locale'), opts);
  document.getElementById('sumTime').textContent = selectedTime;
  document.getElementById('sumGuests').textContent = selectedGuests + (selectedGuests===1?' '+bt('person'):' '+bt('persons'));
  goStep(3);
}

function goStep(n) {
  document.querySelectorAll('.step-bar').forEach(function(bar, i) {
    bar.classList.remove('active','done');
    if(i < n-1) bar.classList.add('done');
    else if(i === n-1) bar.classList.add('active');
  });
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById('s'+n).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
