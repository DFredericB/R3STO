<!DOCTYPE html>
<html lang="fr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R3STO Delivery — Commande en ligne</title>
<meta name="description" content="Commandez en ligne via R3STO Delivery. Livraison à domicile ou retrait sur place. Paiement en ligne ou à la livraison.">
<link rel="icon" type="image/jpeg" href="https://r3sto.ch/logo-r3sto.jpg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafbfd;--surf:#ffffff;--surf2:#f0f2f5;--surf3:#e8ecf2;
  --text:#1a2332;--t2:#3d4f66;--t3:#6b7d94;--muted:#b0b5c3;
  --ac:#2d6cb8;--ac2:#1f5a9e;--ac-light:#eef3fb;--bl:#2d6cb8;
  --gn:#1e8f4e;--gn-light:#e8f7ef;--gn-bg:#f0faf5;
  --rd:#c53030;--rd-light:#fde8e7;
  --am:#b87d0a;--am-light:#fef6e7;
  --border:rgba(30,50,80,.12);--border2:#d1d5e0;
  --ff:'DM Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
  --max:1080px;--rad:14px;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.1);
}
html{scroll-behavior:smooth;overflow-x:hidden;width:100%;max-width:100vw}
body{font-family:var(--ff);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;width:100%;max-width:100vw;box-sizing:border-box}
a{color:var(--ac);text-decoration:none}
img{max-width:100%;display:block}
button{font-family:var(--ff);cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:var(--ff);outline:none}

/* ── HEADER ── */
.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 20px;box-sizing:border-box;width:100%;max-width:100vw}
.header-inner{max-width:var(--max);margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px;box-sizing:border-box}
.header-left{display:flex;align-items:center;gap:12px}
.resto-logo{width:48px;height:48px;border-radius:0;overflow:hidden;flex-shrink:0}
.resto-logo img{width:100%;height:100%;object-fit:cover}
.resto-logo .initials{width:100%;height:100%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.resto-info h1{font-size:16px;font-weight:700;line-height:1.2}
.resto-info p{font-size:11px;color:var(--t3);font-weight:500}
.header-right{display:flex;align-items:center;gap:12px}
.mode-toggle{display:flex;background:var(--surf2);border-radius:10px;padding:3px;border:1px solid var(--border);gap:2px}
.mode-btn{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;background:none;color:var(--t3);transition:.2s}
.mode-btn.active{background:var(--surf);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* ── LANGUAGE SWITCHER ── */
.lang-toggle{display:flex;gap:6px;align-items:center;margin-left:8px}
.lang-btn{padding:6px 12px;border-radius:12px;border:1.5px solid var(--border);background:var(--surf2);color:var(--t2);font-size:11px;font-weight:700;cursor:pointer;transition:.15s;font-family:'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.05em}
.lang-btn:active{transform:scale(.95)}
.lang-btn.active{border-color:var(--bl);background:rgba(68,128,216,.12);color:var(--bl)}
.cart-btn{position:relative;width:42px;height:42px;border-radius:10px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;transition:.15s}
.cart-btn:hover{background:var(--ac2)}
.cart-btn svg{width:20px;height:20px}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--rd);color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--surf)}
.cart-badge:empty,.cart-badge[data-count="0"]{display:none}

/* ── STATUS BAR ── */
.status-bar{background:var(--gn-bg);border-bottom:1px solid rgba(26,135,84,.15);padding:8px 20px;text-align:center;font-size:12px;color:var(--gn);font-weight:600}
.status-bar.closed{background:var(--rd-light);color:var(--rd)}
.status-bar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── PROMO BANNER ── */
.promo-banner{background:linear-gradient(135deg,var(--ac) 0%,#1a4580 100%);color:#fff;padding:12px 20px;text-align:center;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.promo-banner .tag{background:rgba(255,255,255,.2);padding:2px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}

/* ── LAYOUT ── */
.layout{max-width:var(--max);margin:0 auto;padding:20px;display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start;box-sizing:border-box}
@media(max-width:860px){.layout{grid-template-columns:1fr;padding:12px;box-sizing:border-box}.cart-panel{display:none}.cart-panel.mobile-open{display:block;position:fixed;inset:0;z-index:200;background:var(--surf);overflow-y:auto;padding:20px;animation:slideUp .25s ease}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ── CATEGORIES NAV ── */
.cat-nav{position:sticky;top:64px;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 20px;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.cat-nav::-webkit-scrollbar{display:none}
.cat-nav-inner{max-width:var(--max);margin:0 auto;display:flex;gap:4px;padding:8px 0;flex-wrap:wrap}
.cat-pill{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;color:var(--t3);background:none;border:1px solid transparent;white-space:nowrap;transition:.15s}
.cat-pill:hover{color:var(--text);background:var(--surf2)}
.cat-pill.active{background:var(--ac);color:#fff;border-color:var(--ac)}

/* ── MENU DU JOUR ── */
.menu-du-jour{background:linear-gradient(135deg,#fef9f0 0%,#fdf3ea 100%);border:1.5px solid rgba(230,147,10,.2);border-radius:var(--rad);padding:18px;margin-bottom:24px}
.mdj-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mdj-head .badge{background:var(--am);color:#fff;padding:3px 12px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.mdj-head h3{font-size:15px;font-weight:700}
.mdj-items{display:flex;gap:10px;flex-wrap:wrap}
.mdj-item{flex:1;min-width:200px;background:rgba(255,255,255,.7);border:1px solid rgba(230,147,10,.15);border-radius:10px;padding:12px;cursor:pointer;transition:.15s}
.mdj-item:hover{border-color:var(--am);box-shadow:0 2px 8px rgba(230,147,10,.1)}
.mdj-item h4{font-size:13px;font-weight:700;margin-bottom:2px}
.mdj-item p{font-size:11px;color:var(--t3);line-height:1.3}
.mdj-item .mdj-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.mdj-item .mdj-price{font-size:14px;font-weight:800;color:var(--am)}
.mdj-item .mdj-old{font-size:11px;color:var(--t3);text-decoration:line-through}

/* ── MENU ITEMS ── */
.menu-section{margin-bottom:32px}
.menu-section h2{font-size:20px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.menu-section h2 .cat-icon{width:32px;height:32px;border-radius:8px;background:var(--surf2);display:flex;align-items:center;justify-content:center}
.menu-section h2 .cat-icon svg{width:18px;height:18px;color:var(--ac)}
.menu-section .section-desc{font-size:13px;color:var(--t3);margin-bottom:16px}
.menu-grid{display:flex;flex-direction:column;gap:10px}
.menu-item{display:flex;gap:14px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rad);padding:14px;cursor:pointer;transition:.15s;align-items:center}
.menu-item:hover{border-color:var(--ac);box-shadow:0 2px 8px rgba(43,91,160,.08)}
.menu-item.unavailable{opacity:.5;pointer-events:none}
.menu-item-img{width:80px;height:80px;border-radius:10px;background:var(--surf2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.menu-item-img img{width:100%;height:100%;object-fit:cover}
.menu-item-img svg{width:36px;height:36px;color:var(--t3);opacity:.6}
.menu-item-img .picto{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--surf2)}
.menu-item-body{flex:1;min-width:0}
.menu-item-body h3{font-size:14px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.menu-item-body p{font-size:12px;color:var(--t3);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.menu-item-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
.item-price{font-size:15px;font-weight:800;color:var(--ac)}
.item-meta{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.item-tag{font-size:9px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--surf2);color:var(--t3)}
.item-tag.veg{background:#e8f7ef;color:#1a8754}
.item-tag.spicy{background:#fde8e7;color:#d93025}
.item-tag.new{background:var(--am-light);color:var(--am)}
.item-tag.promo{background:#eef3fb;color:var(--ac)}
.item-prep{font-size:10px;color:var(--t3);display:flex;align-items:center;gap:3px}
.item-prep svg{width:12px;height:12px}
.allergen-dots{display:flex;gap:3px}
.allergen-dot{width:16px;height:16px;border-radius:50%;background:var(--surf3);font-size:8px;display:flex;align-items:center;justify-content:center;cursor:help;border:1px solid var(--border)}
.add-btn{width:32px;height:32px;border-radius:8px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.1s;cursor:pointer;border:none}
.add-btn:hover{background:var(--ac2);transform:scale(1.08)}
.add-btn svg{width:16px;height:16px}

/* ── CART PANEL ── */
.cart-panel{position:sticky;top:110px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rad);overflow:hidden}
.cart-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.cart-header h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.cart-header h3 svg{width:16px;height:16px}
.cart-header .clear{font-size:11px;color:var(--rd);font-weight:600;background:none;padding:4px 8px;border-radius:6px}
.cart-header .clear:hover{background:var(--rd-light)}
.cart-empty{padding:40px 20px;text-align:center;color:var(--t3);font-size:13px}
.cart-empty svg{width:48px;height:48px;color:var(--muted);margin:0 auto 10px;display:block}
.cart-items{max-height:340px;overflow-y:auto;padding:8px 0}
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 18px}
.cart-item-info{flex:1;min-width:0}
.cart-item-info .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-info .opts{font-size:10px;color:var(--t3)}
.cart-qty{display:flex;align-items:center;gap:6px}
.cart-qty button{width:24px;height:24px;border-radius:6px;background:var(--surf2);color:var(--text);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);cursor:pointer}
.cart-qty button:hover{background:var(--surf3)}
.cart-qty span{font-size:13px;font-weight:700;min-width:16px;text-align:center}
.cart-item-price{font-size:13px;font-weight:700;color:var(--ac);min-width:55px;text-align:right}
.cart-footer{border-top:1px solid var(--border);padding:16px 18px}
.cart-line{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:6px}
.cart-line.total{font-size:15px;font-weight:800;color:var(--text);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.checkout-btn{width:100%;margin-top:14px;padding:14px;border-radius:10px;background:var(--ac);color:#fff;font-size:14px;font-weight:700;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.checkout-btn:hover{background:var(--ac2)}
.checkout-btn:disabled{opacity:.5;cursor:not-allowed}

/* ── CHECKOUT MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surf);border-radius:18px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:18px;font-weight:800}
.modal-close{width:32px;height:32px;border-radius:8px;background:var(--surf2);color:var(--t2);font-size:16px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--surf3)}
.modal-body{padding:20px 24px}
.step-dots{display:flex;gap:6px;justify-content:center;padding:12px 0 0}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--surf3);transition:.2s}
.step-dot.active{background:var(--ac);width:24px;border-radius:4px}
.step-dot.done{background:var(--gn)}

/* ── FORM ── */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);margin-bottom:5px}
.form-group label .req{color:var(--rd)}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg);transition:.15s}
.form-input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(43,91,160,.08)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-note{font-size:11px;color:var(--t3);margin-top:4px}

/* ── DELIVERY INFO ── */
.delivery-info{background:var(--surf2);border-radius:12px;padding:16px;margin:16px 0;display:flex;flex-wrap:wrap;gap:16px}
.dinfo-item{flex:1;min-width:100px}
.dinfo-item .label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:2px}
.dinfo-item .value{font-size:15px;font-weight:700}
.dinfo-item .value.free{color:var(--gn)}

/* ── PAYMENT ── */
.pay-option{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.pay-option:hover{border-color:var(--ac)}
.pay-option.selected{border-color:var(--ac);background:var(--ac-light)}
.pay-option .pay-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.pay-option.selected .pay-radio{border-color:var(--ac)}
.pay-option.selected .pay-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--ac)}
.pay-option .pay-info{flex:1}
.pay-option .pay-label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.pay-option .pay-desc{font-size:11px;color:var(--t3)}
.pay-option .pay-icons{display:flex;gap:4px;margin-top:4px}
.pay-icon{height:20px;padding:2px 6px;background:var(--surf2);border-radius:4px;font-size:10px;font-weight:700;color:var(--t2);display:flex;align-items:center;gap:3px}
.stripe-badge{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--t3);margin-top:12px;justify-content:center}
.stripe-badge svg{width:14px;height:14px}

/* ── TRACKING ── */
.tracking-page{max-width:520px;margin:40px auto;padding:20px}
.tracking-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--rad);overflow:hidden}
.tracking-header{padding:24px;text-align:center;border-bottom:1px solid var(--border)}
.tracking-header .check{width:56px;height:56px;border-radius:50%;background:var(--gn-light);color:var(--gn);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px}
.tracking-header h2{font-size:20px;font-weight:800;margin-bottom:4px}
.tracking-header .order-id{font-family:var(--mono);font-size:12px;color:var(--t3)}
.tracking-steps{padding:24px}
.track-step{display:flex;gap:14px;position:relative;padding-bottom:24px}
.track-step:last-child{padding-bottom:0}
.track-step::before{content:'';position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--surf3)}
.track-step:last-child::before{display:none}
.track-step.done::before{background:var(--gn)}
.track-icon{width:28px;height:28px;border-radius:50%;background:var(--surf3);color:var(--t3);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;z-index:1}
.track-step.done .track-icon{background:var(--gn);color:#fff}
.track-step.current .track-icon{background:var(--ac);color:#fff;animation:pulse 2s infinite}
.track-body h4{font-size:13px;font-weight:700;margin-bottom:1px}
.track-body p{font-size:11px;color:var(--t3)}
.track-body .time{font-family:var(--mono);font-size:11px;color:var(--t2);margin-top:2px}
.tracking-footer{padding:20px 24px;border-top:1px solid var(--border);text-align:center}
.tracking-footer .eta{font-size:22px;font-weight:800;color:var(--ac)}
.tracking-footer .eta-label{font-size:11px;color:var(--t3);margin-bottom:4px}
.tracking-map{height:180px;background:var(--surf2);border-radius:12px;margin:0 24px 20px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:12px;border:1px dashed var(--border);flex-direction:column;gap:6px}
.tracking-map svg{width:32px;height:32px;color:var(--muted)}

/* ── ALLERGENS TOOLTIP ── */
.allergen-tooltip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--text);color:#fff;font-size:11px;padding:6px 10px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:.15s;z-index:10}
.allergen-dot:hover .allergen-tooltip{opacity:1}

/* ── RESPONSIVE ── */
@media(max-width:860px){
  .layout{padding:12px}
  .menu-item-img{width:64px;height:64px}
  .header-inner{padding:0}
  .mode-btn{padding:6px 12px;font-size:11px}
  .promo-banner{font-size:12px;padding:10px 16px}
}
@media(max-width:480px){.form-row{grid-template-columns:1fr}.menu-item{padding:10px;box-sizing:border-box}.menu-item-img{width:56px;height:56px}.mdj-items{flex-direction:column}.header{width:100vw;margin-left:calc(-50vw + 50%)}.header-inner{padding:0 12px}}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease}
</style>
</head>
<body>

<!-- ═══ STATUS BAR ═══ -->
<div class="status-bar" id="statusBar" data-i18n="status.delivery">
  <span class="dot"></span>
  <span data-i18n="status.delivery">Ouvert — Livraison jusqu'a 21h30 · Retrait jusqu'a 22h00</span>
</div>

<!-- ═══ PROMO BANNER ═══ -->
<div class="promo-banner" id="promoBanner" style="display:none"></div>

<!-- ═══ HEADER ═══ -->
<header class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="resto-logo" id="restoLogo"></div>
      <div class="resto-info">
        <h1 id="restoName">Le Comptoir du Lac</h1>
        <p id="restoMeta">Montpreveyres · 4.7 (128 avis)</p>
      </div>
    </div>
    <div class="header-right">
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="fr" onclick="switchLang('fr')">FR</button>
        <button class="lang-btn" data-lang="de" onclick="switchLang('de')">DE</button>
        <button class="lang-btn" data-lang="it" onclick="switchLang('it')">IT</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeDelivery" onclick="setMode('delivery')" data-i18n="mode.delivery">

let currentLang = localStorage.getItem('r3sto_lang') || 'fr';

function t(key) {
  return DELIV_I18N[currentLang]?.[key] || DELIV_I18N.fr[key] || key;
}
function fmtCHF(n){return n.toFixed(2).replace('.',',');}

function switchLang(lang) {
  if(!DELIV_I18N[lang]) return;
  currentLang = lang;
  localStorage.setItem('r3sto_lang', lang);
  document.getElementById('htmlRoot').lang = lang;

  // Update language button states
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  // Apply translations
  applyTranslations();
  renderMenu();
  renderCart();
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const text = t(key);
    el.textContent = text;
  });
}

function initLanguage() {
  document.getElementById('htmlRoot').lang = currentLang;
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });
  applyTranslations();
}

  }
  const pictoKey = (item.imgType === 'picto' && item.img) ? item.img : 'salad';

// ── CART ──
function findItem(id, isMenuDuJour) {
  if(isMenuDuJour && RESTO.menuDuJour) {
    const found = RESTO.menuDuJour.items.find(i => i.id === id);
    if(found) return found;
  }
  for(const cat of MENU) for(const item of cat.items) if(item.id===id) return item;
  return null;
}

function addToCart(id, isMenuDuJour) {
  const item = findItem(id, isMenuDuJour);
  if(!item) return;
  const existing = cart.find(c => c.id === id);
  if(existing) { existing.qty++; }
  else { cart.push({ id, name:item.name, price:item.price, qty:1 }); }
  renderCart();
  const badge = document.getElementById('cartBadge');
  badge.style.transform = 'scale(1.4)';
  setTimeout(() => badge.style.transform = 'scale(1)', 150);
}

function updateQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0) cart = cart.filter(c => c.id !== id);
  renderCart();
}

function clearCart() { cart = []; renderCart(); }
function getSubtotal() { return cart.reduce((s,i) => s + i.price * i.qty, 0); }
function getItemCount() { return cart.reduce((s,i) => s + i.qty, 0); }
function getDeliveryFee() {
  if(mode === 'pickup') return 0;
  return getSubtotal() >= RESTO.freeDeliveryMin ? 0 : RESTO.deliveryFee;
}
function getTotal() { return getSubtotal() + getDeliveryFee(); }

function renderCart() {
  const count = getItemCount();
  document.getElementById('cartBadge').textContent = count;
  document.getElementById('cartBadge').setAttribute('data-count', count);
  const cont = document.getElementById('cartContent');
  if(count === 0) {
    cont.innerHTML = `<div class="cart-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;color:var(--muted);margin:0 auto 10px;display:block"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>
      <span data-i18n="cart.empty">${t('cart.empty')}</span></div>`;
    return;
  }
  const sub = getSubtotal();
  const fee = getDeliveryFee();
  const total = getTotal();
  const belowMin = mode === 'delivery' && sub < RESTO.minOrder;

  // Estimated prep = max prep time across items
  const maxPrep = Math.max(...cart.map(ci => {
    const it = findItem(ci.id, true);
    return it?.prepMins || 10;
  }));

  cont.innerHTML = `
    <div class="cart-items">
      ${cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="name">${item.name}</div>
          </div>
          <div class="cart-qty">
            <button onclick="event.stopPropagation();updateQty(${item.id},-1)">-</button>
            <span>${item.qty}</span>
            <button onclick="event.stopPropagation();updateQty(${item.id},+1)">+</button>
          </div>
          <div class="cart-item-price">CHF ${fmtCHF(item.price*item.qty)}</div>
        </div>
      `).join('')}
    </div>
    <div class="cart-footer">
      <div class="cart-line"><span data-i18n="cart.subtotal">${t('cart.subtotal')}</span><span>CHF ${fmtCHF(sub)}</span></div>
      ${mode==='delivery' ? `<div class="cart-line"><span data-i18n="cart.delivery">${t('cart.delivery')}</span><span${fee===0?' style="color:var(--gn);font-weight:700"':''}>
        <span data-i18n="${fee===0?'cart.free':''}">` + (fee===0?t('cart.free'):'CHF '+fmtCHF(fee)) + `</span></span></div>` : ''}
      ${mode==='delivery' && fee > 0 ? `<div class="cart-line" style="color:var(--gn);font-size:11px"><span><span data-i18n="cart.freeFrom">${t('cart.freeFrom')}</span> CHF ${fmtCHF(RESTO.freeDeliveryMin)}</span><span>-CHF ${fmtCHF(fee)}</span></div>` : ''}
      <div class="cart-line" style="font-size:11px;color:var(--t3)">
        <span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span data-i18n="cart.prep">${t('cart.prep')}</span>
        </span>
        <span>~${maxPrep} min</span>
      </div>
      <div class="cart-line total"><span data-i18n="cart.total">${t('cart.total')}</span><span>CHF ${fmtCHF(total)}</span></div>
      ${belowMin ? `<div style="color:var(--am);font-size:11px;margin-top:6px;text-align:center"><span data-i18n="cart.minOrder">${t('cart.minOrder')}</span> ${RESTO.minOrder} <span data-i18n="cart.missing">${t('cart.missing')}</span> ${fmtCHF(RESTO.minOrder-sub)})</div>` : ''}
      <button class="checkout-btn" ${belowMin?'disabled':''} onclick="openCheckout()">
        <span data-i18n="cart.order">${t('cart.order')}</span> · CHF ${fmtCHF(total)}
      </button>
    </div>
  `;
}

// ── MODE TOGGLE ──
function setMode(m) {
  mode = m;
  document.getElementById('modeDelivery').classList.toggle('active', m==='delivery');
  document.getElementById('modePickup').classList.toggle('active', m==='pickup');
  const bar = document.getElementById('statusBar');
  const statusKey = mode === 'delivery' ? 'status.delivery' : 'status.pickup';
  bar.innerHTML = '<span class="dot"></span><span data-i18n="' + statusKey + '">' + t(statusKey) + '</span>';
  renderCart();
}

function toggleMobileCart() {
  const panel = document.getElementById('cartPanel');
  if(panel.classList.contains('mobile-open')) {
    panel.classList.remove('mobile-open');
  } else {
    panel.classList.add('mobile-open');
    if(!panel.querySelector('.mobile-close')) {
      const btn = document.createElement('button');
      btn.className = 'mobile-close';
      btn.textContent = currentLang === 'fr' ? 'Fermer' : currentLang === 'de' ? 'Schließen' : currentLang === 'it' ? 'Chiudi' : 'Close';
      btn.style.cssText = 'display:block;width:100%;padding:12px;background:var(--surf2);border:none;border-radius:10px;font-family:var(--ff);font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;margin-top:12px';
      btn.onclick = () => panel.classList.remove('mobile-open');
      panel.appendChild(btn);
    }
  }
}

// ── CHECKOUT FLOW ──
function openCheckout() {
  if(getItemCount() === 0) return;
  checkoutStep = 0;
  document.getElementById('checkoutModal').classList.add('open');
  renderCheckoutStep();
}

function closeCheckout() {
  document.getElementById('checkoutModal').classList.remove('open');
}

function getSteps() {
  return mode === 'delivery' ? CHECKOUT_STEPS_DEL : CHECKOUT_STEPS_PIC;
}

function selectPay(el, method) {
  document.querySelectorAll('.pay-option').forEach(p => p.classList.remove('selected'));
  el.classList.add('selected');
  window._payMethod = method;
}

function saveStepData() {
  if(checkoutStep === 0) {
    customerData.fname = document.getElementById('ck_fname')?.value.trim() || '';
    customerData.lname = document.getElementById('ck_lname')?.value.trim() || '';
    customerData.phone = document.getElementById('ck_phone')?.value.trim() || '';
    customerData.email = document.getElementById('ck_email')?.value.trim() || '';
    customerData.notes = document.getElementById('ck_notes')?.value.trim() || '';
  } else if(checkoutStep === 1 && mode === 'delivery') {
    customerData.address = document.getElementById('ck_address')?.value.trim() || '';
    customerData.zip = document.getElementById('ck_zip')?.value.trim() || '';
    customerData.city = document.getElementById('ck_city')?.value.trim() || '';
    customerData.floor = document.getElementById('ck_floor')?.value.trim() || '';
  }
}

function nextStep() {
  saveStepData();
  if(checkoutStep === 0) {
    if(!customerData.fname || !customerData.lname) { alert(t('checkout.nameError')); return; }
    if(!customerData.phone || customerData.phone.replace(/[^0-9]/g,'').length < 7) { alert(t('checkout.phoneError')); return; }
  }
  if(checkoutStep === 1 && mode === 'delivery') {
    if(!customerData.address || !customerData.zip || !customerData.city) { alert(t('checkout.addressError')); return; }
  }
  checkoutStep++;
  renderCheckoutStep();
}

function prevStep() {
  saveStepData();
  if(checkoutStep > 0) checkoutStep--;
  renderCheckoutStep();
}
