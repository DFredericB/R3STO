  .shadow-soft { box-shadow: 0 4px 16px rgba(200,210,230,.15); }
  .no-fx { }
  .label { font-size: 13px; font-weight: 700; margin-top: 20px; padding: 8px 16px; border-radius: 20px; text-align: center; }
  .dark .label { background: rgba(68,128,216,.12); color: #7bb8ff; }
